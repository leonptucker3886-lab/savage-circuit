const C=document.getElementById('c'),X=C.getContext('2d'),DP=devicePixelRatio||1;let W,H,S;

let AC=null,MG=null,musicT=null;
function au(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination);}if(AC.state==='suspended')AC.resume();}
function tone(f,d,t,v,sl){if(!AC)return;t=t||'square';v=v||.2;const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sl),AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(MG);o.start();o.stop(AC.currentTime+d);}
function noise(d,v,hp){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d|0,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=hp;s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(MG);s.start();}
const SFX={hit(){noise(.12,.4,400);tone(120,.15,'sawtooth',.25,.4)},heavy(){noise(.25,.5,150);tone(80,.3,'square',.3,.3)},block(){tone(900,.06,'square',.12);noise(.05,.15,3000)},whiff(){noise(.08,.08,2000)},special(){tone(300,.4,'sawtooth',.2,4)},breaker(){tone(200,.6,'square',.3,6);noise(.4,.4,500)},ko(){tone(400,1.2,'sawtooth',.3,.1);noise(1,.4,100)},beep(){tone(660,.08,'square',.15)},stinger(){tone(110,1,'sawtooth',.3,.5);tone(55,1.2,'square',.25)}};
function voice(s){try{const u=new SpeechSynthesisUtterance(s);u.pitch=.2;u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function music(on){clearInterval(musicT);if(!on||!AC)return;let k=0;const b=[55,55,65,55,73,55,65,49];musicT=setInterval(()=>{tone(b[k%8],.18,'sawtooth',.1);if(k%4==0)noise(.1,.25,60);if(k%4==2)noise(.06,.12,5000);if(k%16==12)tone(b[k%8]*4,.3,'square',.05,1.5);k++;},170);}
const ROSTER=[
{n:'VOLT',d:'Rogue lineman. Lightning fists.',c:'#29d4ff',c2:'#0a3a66',spd:1.15,pw:1,hp:1},
{n:'GRAVEMAW',d:'Bone-plated brute from the pits.',c:'#c9b58a',c2:'#3a2a18',spd:.85,pw:1.3,hp:1.2},

{n:'EMBERFANG',d:'Wolf-blooded fire brawler.',c:'#ff6a1a',c2:'#4a1400',spd:1.05,pw:1.1,hp:1},
{n:'CIRCUIT-9',d:'Escaped war cyborg. Final boss.',c:'#ff2050',c2:'#222',spd:1,pw:1.2,hp:1.4,boss:1}];

const AUTO=['jab','jab','heavy','upper','special'];
function F(def,x,dir,cpu){return{def,x,y:0,vy:0,dir,cpu,hp:100*def.hp,mhp:100*def.hp,meter:0,mv:null,mn:'',t:0,hit:0,stun:0,block:0,combo:0,breakWin:0,ko:0,flash:0,walk:0,ai:0,wins:0};}
let P1,P2,proj=[],parts=[],shake=0,round=1,stage=0,ladder=[],timer=99,tick=0,state='intro',it=0,mode='manual',sel=0,hitstop=0,ann='',annT=0,bfx=0,overT=0,coins=+localStorage.sc_coins||0;

function up(e){const t=T[e.pointerId];if(!t)return;delete T[e.pointerId];if(t.side==='R'&&state==='fight'){const dx=t.x-t.x0,dy=t.y-t.y0,d=Math.hypot(dx,dy)/DP,dt=performance.now()-t.t;let m;if(d<30)m=dt>350?'special':'jab';else if(Math.abs(dy)>Math.abs(dx))m=dy<0?'upper':'sweep';else m='heavy';act(m);}}
C.addEventListener('pointerup',up);C.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{au();const k=e.key.toLowerCase();K[k]=1;if(state!=='fight'){menuTap(null,k);return;}const m={j:'jab',k:'heavy',i:'upper',m:'sweep',l:'special',' ':'breaker'}[k];if(m)act(m);if(k==='escape'||k==='p')state='pause';});

let autoI=0,autoT=-99;
function act(m){const f=P1;if(!f||f.ko)return;
 if(f.stun>0){if(f.breakWin>0&&(m==='breaker'||m==='special'))doBreaker(f,P2);return;}
 if(m==='breaker')return;

function startMove(f,m){if(f.ko||f.stun>0)return;if(f.mv&&f.t<f.mv.s+f.mv.a+f.mv.r*.5)return;

const GY0=0;function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y:GY-y,vx:(Math.random()-.5)*14,vy:(Math.random()-.7)*14,l:30+Math.random()*20,c});}
function land(a,d,dmg,kb,info){
 const blocking=d.block&&!d.stun&&!(info.low&&d.y==0&&d.blockHigh);
 if(d.block&&!d.stun&&!info.unblock){d.hp-=dmg*.15;d.x+=a.dir*kb*1.5;SFX.block();burst(d.x-a.dir*20,120,'#9cf',6);a.meter=Math.min(100,a.meter+2);return;}
 d.hp-=dmg*a.def.pw*(1+Math.min(a.combo,8)*.08);d.stun=info.ultra?999:16;d.x+=a.dir*kb;d.flash=6;a.combo++;a.comboT=50;a.meter=Math.min(100,a.meter+6);d.meter=Math.min(100,d.meter+3);
 if(info.lift){d.vy=info.lift;}
 d.breakWin=a.combo>=3?18:0;hitstop=dmg>8?6:3;shake=dmg>8?9:4;(dmg>8?SFX.heavy:SFX.hit)();burst(d.x,110+Math.random()*40,a.def.c,dmg>8?18:9);
 if(a.combo===4)say('SUPER COMBO');if(a.combo===6)say('KILLER COMBO');if(a.combo===9)say('ULTRA STREAK');
 if(d.hp<=0){d.hp=0;KO(a,d,info.ultra);}}
function KO(a,d,ultra){if(d.ko)return;d.ko=1;d.vy=12;a.wins++;SFX.ko();hitstop=30;shake=20;say(ultra?'ULTRA FINISH!':'K.O.');state='roundover';overT=150;if(a===P1){coins+=ultra?50:20;localStorage.sc_coins=coins;}}
function updF(f,o,dt){
 f.dir=o.x>f.x?1:-1;if(f.flash>0)f.flash--;if(f.comboT>0&&--f.comboT==0)f.combo=0;
 if(f.y>0||f.vy){f.y+=f.vy;f.vy-=1;if(f.y<=0){f.y=0;f.vy=0;}}
 if(f.ko)return;
 if(f.stun>0){f.stun--;if(f.breakWin>0)f.breakWin--;f.block=0;f.mv=null;return;}
 if(f.mv){f.t++;const m=f.mv;
  if(f.mn==='ultra'){if(f.t%6==0&&f.t<60){o.stun=20;land(f,o,4,1,{unblock:1});burst(o.x,120,'#fff',10);}if(f.t>=60){o.hp=0;KO(f,o,1);f.mv=null;}return;}
  if(!f.hit&&f.t>=m.s&&f.t<m.s+m.a&&m.rng){if(Math.abs(o.x-f.x)<m.rng&&Math.abs(o.y-f.y)<90){f.hit=1;land(f,o,m.dmg,m.kb,m);}}
  if(f.t>=m.s+m.a+m.r)f.mv=null;return;}
 if(f.cpu)ai(f,o);else{
  const s=stick();let dx=s.dx;f.block=0;
  if(mode==='auto'){const dist=Math.abs(o.x-f.x);// auto-walk + auto-guard
   if(!s.on){if(dist>110)dx=f.dir*40;if(o.mv&&o.t<o.mv.s+o.mv.a&&dist<130&&Math.random()<.55)f.block=1;}}
  if(s.on&&dx*f.dir<-25)f.block=1;
  if(!f.block&&Math.abs(dx)>15){f.x+=Math.sign(dx)*4.2*f.def.spd;f.walk+=.3;}
  if(s.dy<-40&&f.y==0)f.vy=17;}
 f.x=Math.max(60,Math.min(900,f.x));}
function ai(f,o){f.block=0;const d=Math.abs(o.x-f.x),lvl=.35+stage*.12;f.ai--;
 if(o.mv&&o.t<o.mv.s&&d<120&&Math.random()<lvl*.5){f.block=1;return;}
 if(d>95){f.x+=f.dir*3.4*f.def.spd;f.walk+=.3;if(f.ai<=0&&f.meter>=25&&Math.random()<.02*lvl*3){startMove(f,'special');f.ai=40;}}
 else if(f.ai<=0){const r=Math.random();startMove(f,r<.4?'jab':r<.6?'heavy':r<.8?'sweep':'upper');f.ai=(30-stage*4)+Math.random()*25;}
 // CPU breaker
 if(f.stun>0&&f.breakWin>0&&Math.random()<.03*lvl)doBreaker(f,o);}
function upd(){
 if(hitstop>0){hitstop--;return;}tick++;
 updF(P1,P2);updF(P2,P1);
 if(P1.stun>0&&P1.breakWin>0&&P2.cpu===false);
 if(P2.stun>0&&P2.breakWin>0&&Math.random()<.02*(.35+stage*.12))doBreaker(P2,P1);
 const gap=Math.abs(P1.x-P2.x);if(gap<50){const p=(50-gap)/2;P1.x-=P1.dir*p;P2.x-=P2.dir*p;}
 for(const p of proj){p.x+=p.vx;p.life--;const t=p.o===P1?P2:P1;if(Math.abs(t.x-p.x)<40&&t.y<80&&!t.ko){p.life=0;land(p.o,t,12,6,{});}if(Math.random()<.6)parts.push({x:p.x,y:GY-p.y+(Math.random()-.5)*20,vx:-p.vx*.2,vy:(Math.random()-.5)*2,l:15,c:p.c});}
 proj=proj.filter(p=>p.life>0&&p.x>0&&p.x<960);
 if(state==='fight'&&tick%60==0&&timer>0&&--timer==0){const w=P1.hp>=P2.hp?P1:P2;KO(w,w===P1?P2:P1);}}
// ---------- DRAW ----------
const GY=430;
function drawF(f){const d=f.def,x=f.x,y=GY-f.y,dir=f.dir,m=f.mv,ph=m?Math.min(1,f.t/(m.s+1)):0,ext=m&&f.t>=m.s&&f.t<m.s+m.a+4?1:0;
 X.save();X.translate(x,y);if(f.ko){X.rotate(-dir*Math.min(1.5,(150-overT)/30));}

 else{X.lineTo(30-ph*10,-118);X.lineTo(40-ph*20,-140);}X.stroke();

function bar(x,y,w,f,right){X.fillStyle='#300';X.fillRect(x,y,w,22);const p=Math.max(0,f.hp/f.mhp);X.fillStyle=p>.3?'#2f6':'#f33';right?X.fillRect(x+w*(1-p),y,w*p,22):X.fillRect(x,y,w*p,22);X.strokeStyle='#fff';X.lineWidth=2;X.strokeRect(x,y,w,22);

const STORY=['NEO-HAVEN, 2049.','The Savage Circuit: an illegal tournament','run by the war machine CIRCUIT-9.','Win, and walk free.','Lose... and you are scrap.','FIGHT YOUR WAY TO THE CORE.'];
let csT=0;

  if(p){for(let i=0;i<4;i++){const bx=120+i*190;if(g.x>bx-80&&g.x<bx+80&&g.y>150&&g.y<370){if(sel===i){go();}else{sel=i;SFX.beep();}return;}}if(g.y>400)go();}else if(key==='enter'||key===' ')go();return;}

 if(t<1.5){X.globalAlpha=Math.min(1,t);txt('LEONLINK PRESENTS...',480,270,40,'#fff');X.globalAlpha=1;}
 else if(t<7.5){X.save();X.translate(480,220);X.scale(Math.cos((t-1.5)*Math.PI*1.2),1);X.strokeStyle='#29d4ff';X.lineWidth=10;X.shadowColor='#29d4ff';X.shadowBlur=30;
  X.beginPath();X.arc(0,-70,18,0,7);X.moveTo(0,-52);X.lineTo(0,70);X.moveTo(-50,-20);X.lineTo(50,-20);X.moveTo(-70,30);X.quadraticCurveTo(-60,80,0,75);X.quadraticCurveTo(60,80,70,30);X.stroke();X.restore();X.shadowBlur=0;
  if(t>3.5){X.globalAlpha=Math.min(1,t-3.5);txt('ARCADELINE',480,380,58,'#29d4ff');txt('EPIC',480,430,36,'#ffcf3a');X.globalAlpha=1;}}
 else{if(it===451){SFX.stinger();}const f=(it%10<5||t>8.5);if(f){X.shadowColor='#ff2050';X.shadowBlur=40;txt('SAVAGE',480,230,96,'#ff2050');txt('CIRCUIT',480,330,96,'#fff');X.shadowBlur=0;}
  if(t>8.5)txt('TAP TO CONTINUE',480,440,22,tick%40<20?'#fff':'#888');if(t>9.5&&state==='intro'){}}
 if(it>60)txt('tap to skip',900,525,14,'#555','right');}
function drawTitle(){it++;drawBG();X.fillStyle='rgba(0,0,0,.55)';X.fillRect(-50,-50,1060,640);
 P1=P1||F(ROSTER[4],480,1,true);const boss=F(ROSTER[4],480,1,true);boss.walk=0;drawF(boss);
 X.shadowColor='#ff2050';X.shadowBlur=30;txt('SAVAGE CIRCUIT',480,110,72,'#ff2050');X.shadowBlur=0;txt('A LEONLINK ARCADELINE FIGHTER',480,145,18,'#ffcf3a');
 X.fillStyle='#ffcf3a';X.fillRect(70,385,380,52);X.fillStyle='#29d4ff';X.fillRect(510,385,380,52);
 txt('AUTO-FIGHT (1-TAP COMBOS)',260,418,20,'#000');txt('PRO CONTROLS',700,418,22,'#000');txt('Coins: '+coins,480,480,18,'#ffcf3a');}
function drawStory(){csT++;X.fillStyle='#050008';X.fillRect(-50,-50,1060,640);const n=Math.floor(csT/70);
 for(let i=0;i<=Math.min(n,STORY.length-1);i++){const s=STORY[i],chars=i<n?s.length:Math.floor((csT%70)/1.5);txt(s.slice(0,chars),480,140+i*52,i==STORY.length-1?34:26,i==STORY.length-1?'#ff2050':'#ddd');if(i===n&&chars<s.length&&csT%3==0)tone(1200,.02,'square',.04);}
 txt('tap to skip',900,525,14,'#666','right');if(n>STORY.length+1)state='select';}
function drawSelect(){drawBG();X.fillStyle='rgba(0,0,0,.6)';X.fillRect(-50,-50,1060,640);txt('CHOOSE YOUR FIGHTER',480,80,40,'#fff');
 for(let i=0;i<4;i++){const bx=120+i*190;X.strokeStyle=i===sel?'#ff0':'#444';X.lineWidth=i===sel?5:2;X.strokeRect(bx-80,150,160,220);const f=F(ROSTER[i],bx,1,true);X.save();X.translate(0,-70);X.scale(1,1);drawF(f);X.restore();txt(ROSTER[i].n,bx,395,20,ROSTER[i].c);}
 txt(ROSTER[sel].d,480,440,20,'#ccc');txt('TAP AGAIN TO FIGHT',480,490,26,tick%40<20?'#ff0':'#fa0');}
function drawEnd(win){it++;X.fillStyle='#000';X.fillRect(-50,-50,1060,640);if(win){txt('CHAMPION OF THE CIRCUIT',480,220,46,'#ffcf3a');txt(ROSTER[sel].n+' walks free.',480,280,26,'#fff');}else{txt('YOU ARE SCRAP',480,240,64,'#ff2050');}txt('Coins: '+coins,480,340,22,'#ffcf3a');if(it>60)txt('TAP TO CONTINUE',480,440,22,'#aaa');}
function loop(){requestAnimationFrame(loop);tick++;X.setTransform(1,0,0,1,0,0);X.fillStyle='#000';X.fillRect(0,0,W,H);
 const sx=shake>0?(Math.random()-.5)*shake:0,sy=shake>0?(Math.random()-.5)*shake:0;if(shake>0)shake*=.85;if(shake<.5)shake=0;
 X.setTransform(S,0,0,S,(W-960*S)/2+sx*S,(H-540*S)/2+sy*S);
 if(state==='intro')drawIntro();else if(state==='title')drawTitle();else if(state==='story')drawStory();else if(state==='select')drawSelect();
 else if(state==='over'||state==='win')drawEnd(state==='win');
 else{if(state==='fight'||state==='roundover'){tick--;upd();}if(state==='roundover'&&--overT<=0)afterRound();
  drawBG();for(const p of proj){X.fillStyle=p.c;X.shadowColor=p.c;X.shadowBlur=25;X.beginPath();X.arc(p.x,GY-p.y,16,0,7);X.fill();X.shadowBlur=0;}
  drawF(P2);drawF(P1);for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.5;q.l--;X.fillStyle=q.c;X.globalAlpha=Math.max(0,q.l/40);X.fillRect(q.x,q.y,5,5);}X.globalAlpha=1;parts=parts.filter(q=>q.l>0);
  if(bfx>0){bfx--;X.fillStyle='rgba(255,255,255,'+bfx/40+')';X.fillRect(-50,-50,1060,640);}
  hud();if(state==='pause'){X.fillStyle='rgba(0,0,0,.7)';X.fillRect(-50,-50,1060,640);txt('PAUSED',480,250,60);txt('tap to resume',480,310,22,'#aaa');}}
 X.setTransform(1,0,0,1,0,0);}
loop();
